---
name: build-nvidia
# Builds the NVIDIA variant as a layer on top of the already-published base
# sericea-main image. Reuses the base's cosign-signing machinery.
#
# No push trigger on purpose: this layer FROMs ghcr.io/<owner>/sericea-main:<ver>,
# which only exists once build.yml has published it. Triggering on a main push
# would race the base build (and fail outright the first time, before :44 ever
# exists). Instead it runs on the weekly schedule (after the base build) and on
# manual dispatch — which is also how the stepping-stone images (42/43) are built.
on:
  schedule:
    - cron: '35 10 * * 2'  # 30 min after the base build's Tuesday 10:05 UTC run
  workflow_dispatch:
    inputs:
      fedora_version:
        description: >-
          Fedora version to build the NVIDIA layer for (the base
          sericea-main:<version> must already be published). Use 42 / 43 for
          stepping-stone images; leave blank for the repo's current version.
        required: false
        default: ''
      nvidia_driver:
        description: >-
          Driver branch (akmod-<value>): nvidia-580xx (proprietary 580 legacy,
          required for Pascal/GTX 1070), nvidia or nvidia-open (Turing+).
        required: false
        default: 'nvidia-580xx'

env:
  BASE_IMAGE_NAME: "sericea-main"
  MY_IMAGE_NAME: "sericea-main-nvidia"
  MY_IMAGE_DESC: "sericea-main with NVIDIA proprietary drivers"
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"

jobs:
  check:
    name: Check if build is required
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Decide whether to build
        id: decide
        shell: bash
        run: |
          set -euo pipefail
          # Only the daily schedule is gated; pushes and manual runs always build.
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Event ${{ github.event_name }} — building."
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          VERSION=$(grep -oP '^ARG SOURCE_TAG="\K[^"]+' Containerfile)
          # Rebuild only when the base image we layer on has actually changed.
          CUR=$(podman run --rm quay.io/skopeo/stable inspect \
            --format '{{.Digest}}' \
            "docker://ghcr.io/${OWNER}/${BASE_IMAGE_NAME}:${VERSION}")
          LAST=$(podman run --rm quay.io/skopeo/stable inspect \
            --format '{{ index .Labels "dev.sericea.base-digest" }}' \
            "docker://ghcr.io/${OWNER}/${MY_IMAGE_NAME}:latest" 2>/dev/null || echo "")
          echo "base digest now:    ${CUR}"
          echo "last built against: ${LAST:-<none>}"
          if [ "${CUR}" != "${LAST}" ]; then
            echo "Base changed — building."
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "Base unchanged — skipping scheduled rebuild."
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  build_push:
    name: Build and push NVIDIA image
    runs-on: ubuntu-24.04
    needs: check
    if: needs.check.outputs.build == 'true'

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@v9

      # Effective Fedora version: the workflow_dispatch override if given, else
      # the Containerfile's SOURCE_TAG. A "transient" build targets a Fedora
      # version other than the repo's current one (a stepping-stone image that
      # must not move :latest).
      - name: Resolve version
        id: src
        shell: bash
        run: |
          set -euo pipefail
          INPUT="${{ github.event.inputs.fedora_version }}"
          DEFAULT=$(grep -oP '^ARG SOURCE_TAG="\K[^"]+' Containerfile)
          VERSION="${INPUT:-$DEFAULT}"
          DRIVER="${{ github.event.inputs.nvidia_driver }}"
          DRIVER="${DRIVER:-nvidia-580xx}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "driver=${DRIVER}" >> "$GITHUB_OUTPUT"
          if [ -n "${INPUT}" ] && [ "${INPUT}" != "${DEFAULT}" ]; then
            echo "transient=true" >> "$GITHUB_OUTPUT"
          else
            echo "transient=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate tags
        id: generate-tags
        shell: bash
        run: |
          TIMESTAMP="$(date +%Y%m%d)"
          VERSION="${{ steps.src.outputs.version }}"
          if [[ "${{ steps.src.outputs.transient }}" == "true" ]]; then
              alias_tags=("${VERSION}" "${VERSION}-${TIMESTAMP}")
          else
              alias_tags=("${TIMESTAMP}" "latest" "${VERSION}")
          fi
          echo "Generated the following tags:"
          printf '  %s\n' "${alias_tags[@]}"
          echo "alias_tags=${alias_tags[*]}" >> "$GITHUB_OUTPUT"

      - name: Image Metadata
        uses: docker/metadata-action@v6
        id: meta
        with:
          images: |
            ${{ env.MY_IMAGE_NAME }}
          labels: |
            io.artifacthub.package.readme-url=https://raw.githubusercontent.com/${{ github.repository }}/main/README.md
            org.opencontainers.image.description=${{ env.MY_IMAGE_DESC }}
            org.opencontainers.image.title=${{ env.MY_IMAGE_NAME }}

      - name: Lowercase Registry
        id: registry_case
        uses: ASzc/change-string-case-action@v8
        with:
          string: ${{ env.IMAGE_REGISTRY }}

      # Record the base image digest we layer on, so the next scheduled run can
      # tell whether the base actually changed (see the "check" job).
      - name: Resolve base image digest
        id: basedigest
        shell: bash
        run: |
          set -euo pipefail
          DIGEST=$(podman run --rm quay.io/skopeo/stable inspect \
            --format '{{.Digest}}' \
            "docker://${{ steps.registry_case.outputs.lowercase }}/${BASE_IMAGE_NAME}:${{ steps.src.outputs.version }}")
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Build Image
        id: build_image
        uses: redhat-actions/buildah-build@v2
        with:
          containerfiles: |
            ./Containerfile.nvidia
          image: ${{ env.MY_IMAGE_NAME }}
          build-args: |
            SOURCE_REGISTRY=${{ steps.registry_case.outputs.lowercase }}
            SOURCE_IMAGE=${{ env.BASE_IMAGE_NAME }}
            SOURCE_TAG=${{ steps.src.outputs.version }}
            NVIDIA_DRIVER=${{ steps.src.outputs.driver }}
          tags: |
            ${{ steps.generate-tags.outputs.alias_tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            dev.sericea.base-digest=${{ steps.basedigest.outputs.digest }}
          oci: false

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Image to GHCR
        uses: redhat-actions/push-to-registry@v3
        id: push
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ github.token }}
        with:
          image: ${{ steps.build_image.outputs.image }}
          tags: ${{ steps.build_image.outputs.tags }}
          registry: ${{ steps.registry_case.outputs.lowercase }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_PASSWORD }}
          extra-args: |
            --disable-content-trust

      # Pin cosign to v2.x (v3 writes OCI 1.1 referrer bundles that Fedora's
      # containers/image cannot read — see build.yml for the full rationale).
      - uses: sigstore/cosign-installer@v4.1.2
        if: github.event_name != 'pull_request'
        with:
          cosign-release: 'v2.4.1'

      - name: Sign container image
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          IMAGE="${{ steps.registry_case.outputs.lowercase }}/${{ steps.build_image.outputs.image }}"
          read -r TAG _ <<< "${{ steps.build_image.outputs.tags }}"
          cosign sign -y --key env://COSIGN_PRIVATE_KEY "${IMAGE}:${TAG}"
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
