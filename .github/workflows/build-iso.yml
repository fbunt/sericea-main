---
name: build-iso
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Published image tag to build an installer ISO from"
        default: latest
        required: false

jobs:
  build-iso:
    name: Build installer ISO
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@v9

      - name: Build ISO with bootc-image-builder
        shell: bash
        run: |
          set -euo pipefail
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          IMAGE="ghcr.io/${OWNER}/${{ github.event.repository.name }}:${{ inputs.tag }}"
          echo "Building ISO from ${IMAGE}"
          mkdir -p output
          sudo podman run --rm --privileged \
            --security-opt label=type:unconfined_t \
            -v "$PWD/output:/output" \
            -v "$PWD/iso/config.toml:/config.toml:ro" \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type iso \
            --target-arch amd64 \
            "${IMAGE}"
          sudo chown -R "$(id -u):$(id -g)" output

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v7
        with:
          name: sericea-main-iso
          path: output/**/*.iso
          retention-days: 7
          if-no-files-found: error
