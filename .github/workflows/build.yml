---
name: build-ublue-custom
on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: '05 10 * * 2'  # 10:05am UTC every Tuesday
  push:
    branches:
      - main
      - sway-atomic
    paths-ignore:
      - '**/README.md'
  workflow_dispatch:
    inputs:
      source_tag:
        description: >-
          Fedora base tag to build, overriding the Containerfile's SOURCE_TAG.
          Use for transient stepping-stone images (e.g. 42 or 43); leave blank
          to build the repo's current Fedora version.
        required: false
        default: ''

env:
  MY_IMAGE_NAME: "${{ github.event.repository.name }}"  # the name of the image produced by this build, matches repo names
  MY_IMAGE_DESC: "My Customized Universal Blue Image"
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit

jobs:
  check:
    name: Check if build is required
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Decide whether to build
        id: decide
        shell: bash
        run: |
          set -euo pipefail
          # Only the daily schedule is gated; pushes, PRs and manual runs always build.
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Event ${{ github.event_name }} — building."
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Base ref comes from the Containerfile so there is a single source of truth.
          REG=$(grep -oP '^ARG SOURCE_REGISTRY="\K[^"]+' Containerfile)
          IMG=$(grep -oP '^ARG SOURCE_IMAGE="\K[^"]+' Containerfile)
          TAG=$(grep -oP '^ARG SOURCE_TAG="\K[^"]+' Containerfile)
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          CUR=$(podman run --rm quay.io/skopeo/stable inspect \
            --format '{{.Digest}}' "docker://${REG}/${IMG}:${TAG}")
          LAST=$(podman run --rm quay.io/skopeo/stable inspect \
            --format '{{ index .Labels "dev.sericea.base-digest" }}' \
            "docker://ghcr.io/${OWNER}/${MY_IMAGE_NAME}:latest" 2>/dev/null || echo "")
          echo "base digest now:          ${CUR}"
          echo "last built against:       ${LAST:-<none>}"
          if [ "${CUR}" != "${LAST}" ]; then
            echo "Base changed — building."
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "Base unchanged — skipping scheduled rebuild."
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  build_push:
    name: Build and push image
    runs-on: ubuntu-24.04
    needs: check
    if: needs.check.outputs.build == 'true'

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      # Checkout push-to-registry action GitHub repository
      - name: Checkout Push to Registry action
        uses: actions/checkout@v7

      # Effective Fedora base tag: the workflow_dispatch override if given, else
      # the Containerfile's SOURCE_TAG (single source of truth). A "transient"
      # build is a manual override to a Fedora version other than the repo's
      # current one — i.e. a stepping-stone image that must not move :latest.
      - name: Resolve source tag
        id: src
        shell: bash
        run: |
          set -euo pipefail
          INPUT="${{ github.event.inputs.source_tag }}"
          DEFAULT=$(grep -oP '^ARG SOURCE_TAG="\K[^"]+' Containerfile)
          TAG="${INPUT:-$DEFAULT}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if [ -n "${INPUT}" ] && [ "${INPUT}" != "${DEFAULT}" ]; then
            echo "transient=true" >> "$GITHUB_OUTPUT"
          else
            echo "transient=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Building base tag ${TAG} (transient=${INPUT:+true})"

      - name: Generate tags
        id: generate-tags
        shell: bash
        run: |
          TIMESTAMP="$(date +%Y%m%d)"
          SHA_SHORT="${GITHUB_SHA::7}"
          VERSION="${{ steps.src.outputs.tag }}"
          # Sanitize branch name for use as an image tag (/ -> -).
          BRANCH="${GITHUB_REF_NAME//\//-}"

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
              alias_tags=("pr-${{ github.event.number }}" "${SHA_SHORT}")
          elif [[ "${{ steps.src.outputs.transient }}" == "true" ]]; then
              # Stepping-stone build for an older Fedora: tag by version only so
              # it can't clobber main's :latest / current bare timestamp.
              alias_tags=("${VERSION}" "${VERSION}-${TIMESTAMP}")
          elif [[ "${BRANCH}" == "main" ]]; then
              # Publish the Fedora-major tag (e.g. :44) alongside latest/timestamp
              # so version-pinned references (the nvidia layer, rebases) resolve.
              alias_tags=("${TIMESTAMP}" "latest" "${VERSION}")
          else
              # Non-main branch push: keep tags branch-scoped so they can't
              # clobber main's :latest / bare timestamp.
              alias_tags=("${BRANCH}" "${BRANCH}-${SHA_SHORT}" "${BRANCH}-${TIMESTAMP}")
          fi

          echo "Generated the following tags:"
          printf '  %s\n' "${alias_tags[@]}"
          echo "alias_tags=${alias_tags[*]}" >> $GITHUB_OUTPUT

      # Build metadata
      - name: Image Metadata
        uses: docker/metadata-action@v6
        id: meta
        with:
          images: |
            ${{ env.MY_IMAGE_NAME }}

          labels: |
            io.artifacthub.package.readme-url=https://raw.githubusercontent.com/${{ github.repository }}/main/README.md
            org.opencontainers.image.description=${{ env.MY_IMAGE_DESC }}
            org.opencontainers.image.title=${{ env.MY_IMAGE_NAME }}

      # Record the base image digest so the next scheduled run can tell whether
      # Fedora's base actually changed (see the "check" job).
      - name: Resolve base image digest
        id: basedigest
        shell: bash
        run: |
          set -euo pipefail
          REG=$(grep -oP '^ARG SOURCE_REGISTRY="\K[^"]+' Containerfile)
          IMG=$(grep -oP '^ARG SOURCE_IMAGE="\K[^"]+' Containerfile)
          TAG="${{ steps.src.outputs.tag }}"
          DIGEST=$(podman run --rm quay.io/skopeo/stable inspect \
            --format '{{.Digest}}' "docker://${REG}/${IMG}:${TAG}")
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      # Build image using Buildah action
      - name: Build Image
        id: build_image
        uses: redhat-actions/buildah-build@v2
        with:
          containerfiles: |
            ./Containerfile
          # Postfix image name with -custom to make it a little more descriptive
          # Syntax: https://docs.github.com/en/actions/learn-github-actions/expressions#format
          image: ${{ env.MY_IMAGE_NAME }}
          build-args: |
            SOURCE_TAG=${{ steps.src.outputs.tag }}
          tags: |
            ${{ steps.generate-tags.outputs.alias_tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            dev.sericea.base-digest=${{ steps.basedigest.outputs.digest }}
          oci: false

      # Workaround bug where capital letters in your GitHub username make it impossible to push to GHCR.
      # https://github.com/macbre/push-to-ghcr/issues/12
      - name: Lowercase Registry
        id: registry_case
        uses: ASzc/change-string-case-action@v8
        with:
          string: ${{ env.IMAGE_REGISTRY }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Image to GHCR
        uses: redhat-actions/push-to-registry@v3
        id: push
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ github.token }}
        with:
          image: ${{ steps.build_image.outputs.image }}
          tags: ${{ steps.build_image.outputs.tags }}
          registry: ${{ steps.registry_case.outputs.lowercase }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_PASSWORD }}
          extra-args: |
            --disable-content-trust

      # This section is optional and only needs to be enabled in you plan on distributing
      # your project to others to consume. You will need to create a public and private key
      # using Cosign and save the private key as a repository secret in Github for this workflow
      # to consume. For more details, review the image signing section of the README.

      # Sign container
      - uses: sigstore/cosign-installer@v4.1.2
        if: github.event_name != 'pull_request'
        with:
          # Pin to cosign v2.x. cosign v3 (the installer's current default)
          # writes signatures as OCI 1.1 referrers in the new sigstore-bundle
          # format, which Fedora's containers/image (use-sigstore-attachments,
          # used by rpm-ostree/skopeo) cannot read — verified pulls fail with
          # "A signature was required, but no signature exists". v2.x writes the
          # legacy sha256-<digest>.sig tag attachment that the verifier expects.
          cosign-release: 'v2.4.1'

      - name: Sign container image
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          IMAGE="${{ steps.registry_case.outputs.lowercase }}/${{ steps.build_image.outputs.image }}"
          # Sign by a tag reference and let cosign resolve it to the digest the
          # registry actually serves. Passing ${{ steps.push.outputs.digest }}
          # here put signatures on a digest consumers never pull, so verified
          # pulls failed with "no signature exists".
          read -r TAG _ <<< "${{ steps.build_image.outputs.tags }}"
          cosign sign -y --key env://COSIGN_PRIVATE_KEY "${IMAGE}:${TAG}"
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
